name: publish-whisper-image
# Build + publish the WHISPER engine image (scripts/Dockerfile.whisper) to GHCR as
# ghcr.io/getainode/ainode-whisper:<base engine tag>, e.g. 0.17.0-t5.
#
# Why this workflow exists: the speech-to-text catalog entry cannot run on the
# fleet default engine image. vLLM imports soundfile at module scope as soon as
# the served model reports the transcription task, and no image we ship or pin
# carries the vllm[audio] extras, so a Whisper serve on the stock image dies
# before it binds a port. This publishes the stock build plus librosa and
# soundfile, and the catalog entry pins the published tag, so LAUNCH works on a
# node that has never built anything (the same defect class as the training image
# before publish-train-image.yml existed).
#
# THE TAG IS THE BASE IMAGE'S TAG, not an AINode version. This image tracks the
# engine it derives from, so 0.17.0-t5 is the base scitrera/dgx-spark-vllm tag and
# an AINode release does not need a rebuild. The tag is read out of
# scripts/Dockerfile.whisper's `ARG BASE=` so it cannot drift from the Dockerfile.
#
# COST, read before running: about 22 GB, of which this build adds ~200 MB over
# the base. Cached per runner, so a rebuild that only changes the pip line is
# minutes; a cold runner pulls the 22 GB base first. Nothing triggers it by
# accident: a 'whisper-v*' tag or a manual dispatch only.
#
# How to run it
#
#   Publish (the usual case):
#     gh workflow run publish-whisper-image.yml -f push=true
#   or, tag-triggered, where the tag states the base tag it publishes:
#     git tag whisper-v0.17.0-t5 && git push origin whisper-v0.17.0-t5
#
#   Smoke test the Dockerfile without touching GHCR:
#     gh workflow run publish-whisper-image.yml -f push=false
#
#   Build against a different engine base (then check the numpy/numba pins in
#   the Dockerfile still match that image):
#     gh workflow run publish-whisper-image.yml -f push=true \
#       -f base_image=vllm/vllm-openai:v0.27.1
#
# Self-hosted runner prerequisites are the same as publish-image.yml: labels
# [self-hosted, dgx-spark, aarch64], docker installed, the runner user in the
# docker group, and GITHUB_TOKEN with packages:write.
#
# After the FIRST publish the GHCR package is private, so a node pulling it
# anonymously gets a manifest-unknown error that reads like a missing tag. Make
# the ainode-whisper package public in the org's package settings once, the way
# ainode and ainode-train are.

on:
  push:
    tags:
      - 'whisper-v*'
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to GHCR? (false = build-only smoke test)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      base_image:
        description: "Engine image to build on (empty = the ARG BASE in scripts/Dockerfile.whisper)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: [self-hosted, dgx-spark, aarch64]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/getainode/ainode-whisper

    steps:
      - uses: actions/checkout@v4

      - name: Resolve base image and the tag it publishes
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_BASE: ${{ inputs.base_image }}
          INPUT_PUSH: ${{ inputs.push }}
        run: |
          base="$INPUT_BASE"
          if [ -z "$base" ]; then
            base=$(grep -m1 '^ARG BASE=' scripts/Dockerfile.whisper | sed -E 's/^ARG BASE=//')
          fi
          if [ -z "$base" ]; then
            echo "::error::Could not resolve a base image from the input or from scripts/Dockerfile.whisper."
            exit 1
          fi
          # The published tag is the base image's tag: this image tracks the engine
          # it derives from. A base with no tag would publish ':latest', which says
          # nothing about which engine is inside, so refuse it.
          tag="${base##*:}"
          if [ "$tag" = "$base" ]; then
            echo "::error::Base image '$base' names no tag, so there is no tag to publish under."
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            want="${REF_NAME#whisper-v}"
            push="true"
            if [ "$want" != "$tag" ]; then
              echo "::error::Tag $REF_NAME asks for image tag '$want' but the base image is '$base' (tag '$tag')."
              exit 1
            fi
          else
            push="$INPUT_PUSH"
          fi
          {
            echo "image=$base"
            echo "tag=$tag"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"
          echo "Base $base publishes as ${IMAGE_REPO}:${tag} (push=$push, event=$EVENT_NAME)"

      - name: Build the whisper engine image
        env:
          BASE_IMAGE: ${{ steps.base.outputs.image }}
          IMAGE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          docker build \
            -f scripts/Dockerfile.whisper \
            --build-arg BASE="$BASE_IMAGE" \
            -t "${IMAGE_REPO}:${IMAGE_TAG}" \
            .

      # No GPU needed, and no vLLM server started: this checks the three things
      # the image exists for. The last one is the import that kills a Whisper
      # serve on the stock image, so it is the whole point of the build.
      - name: Smoke test the image
        env:
          IMAGE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          docker run --rm --entrypoint python3 "${IMAGE_REPO}:${IMAGE_TAG}" -c \
            "import importlib.metadata as md; print('librosa', md.version('librosa'), 'soundfile', md.version('soundfile'), 'numpy', md.version('numpy'))"
          docker run --rm --entrypoint python3 "${IMAGE_REPO}:${IMAGE_TAG}" -c \
            "import vllm; print('vllm', vllm.__version__)"
          docker run --rm --entrypoint python3 "${IMAGE_REPO}:${IMAGE_TAG}" -c \
            "import vllm.entrypoints.openai.speech_to_text.speech_to_text; print('speech_to_text imports OK')"

      - name: Report the image size
        env:
          IMAGE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          docker image inspect "${IMAGE_REPO}:${IMAGE_TAG}" \
            --format '{{.Size}}' | awk '{printf "image size: %.1f GB\n", $1/1000000000}'

      - name: Login to GHCR
        if: steps.base.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No :latest. A node pins the tag its catalog recipe names, and a floating
      # latest on an engine image is how a model silently changes engines.
      - name: Push the whisper engine image
        if: steps.base.outputs.push == 'true'
        env:
          IMAGE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          docker push "${IMAGE_REPO}:${IMAGE_TAG}"

      - name: Report the published digest
        if: steps.base.outputs.push == 'true'
        id: digest
        env:
          IMAGE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          digest=$(docker image inspect "${IMAGE_REPO}:${IMAGE_TAG}" \
            --format '{{index .RepoDigests 0}}' 2>/dev/null || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published: $digest"

      - name: Summary
        env:
          BASE_IMAGE: ${{ steps.base.outputs.image }}
          IMAGE_TAG: ${{ steps.base.outputs.tag }}
          PUSHED: ${{ steps.base.outputs.push }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          {
            echo "## AINode whisper engine image"
            echo ""
            echo "**Tag:** \`${IMAGE_REPO}:${IMAGE_TAG}\`"
            echo "**Base:** \`${BASE_IMAGE}\`"
            echo "**Pushed:** \`${PUSHED}\`"
            if [ -n "${DIGEST}" ]; then
              echo "**Digest:** \`${DIGEST}\`"
            fi
            echo ""
            if [ "${PUSHED}" = "true" ]; then
              echo "The speech-to-text catalog entry pins this tag, so a node needs no"
              echo "configuration. To pull it by hand:"
              echo ""
              echo "\`\`\`bash"
              echo "docker pull ${IMAGE_REPO}:${IMAGE_TAG}"
              echo "\`\`\`"
            else
              echo "_Build-only smoke test: GHCR was not touched._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
